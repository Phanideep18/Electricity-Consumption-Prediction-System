# Electricity Consumption Prediction System Configuration
# Based on IEEE 830 SRS Specification v1.0

data:
  dataset_path: "electricity_consumption_dataset.csv"
  target_column: "energy_consumption_kWh"
  drop_columns:
    - "record_id"
    - "date"
  categorical_features:
    - "building_type"
    - "season"
  lag_features:
    - "previous_day_consumption_kWh"
    - "avg_weekly_consumption_kWh"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_state: 42
  stratify_column: "building_type"

models:
  random_state: 42
  acceptance_criteria:
    min_r2: 0.85
    max_mape: 15.0

artifacts:
  models_dir: "artifacts/models"
  metrics_dir: "artifacts/metrics"
  best_model_name: "best_model_pipeline.joblib"
  metrics_summary_name: "model_comparison_metrics.json"
  lag_comparison_name: "lag_features_impact.json"
